version: '3.8'

services:
  mysql-db:
    image: mysql:8.0.33
    container_name: english_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: english_db
    volumes:
      - mysql-data:/var/lib/mysql
      # Initialize database with schemas
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: english_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/english_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY}
    volumes:
      - ./models:/app/models
      - ./uploads:/app/uploads
    depends_on:
      mysql-db:
        condition: service_healthy

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: english_admin
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  user-frontend:
    build:
      context: ./user-frontend
      dockerfile: Dockerfile
    container_name: english_user
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  mysql-data:
